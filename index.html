<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Plant</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Arial, sans-serif;
      }

      /* BODY */
      body {
        background: linear-gradient(135deg, #e0f7fa, #b3e5fc, #81d4fa);
        background-size: 300% 300%;
        animation: gradientMove 12s ease infinite;
        min-height: 100vh;
        overflow-x: hidden;
        padding: 20px;
        position: relative;
      }

      @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      .page {
        width: 100%;
        min-height: calc(100vh - 40px);
        z-index: 1;
      }

      /* LOGIN */
      #loginPage {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* DASHBOARD */
      #dashboardPage {
        display: none;
      }

      /* GLASS CARD */
      .main-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(18px);
        border-radius: 22px;
        padding: 30px 26px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.6);
        animation: fadeIn 0.5s ease;
      }

      /* LOGIN CARD */
      #loginPage .main-card {
        max-width: 520px;
      }

      /* ANIMASI MASUK */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* TITLE */
      .title {
        text-align: center;
        font-size: 2.3rem;
        font-weight: 800;
        background: linear-gradient(90deg, #1e3a8a, #3b82f6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 6px;
      }

      .subtitle {
        text-align: center;
        color: #1e293b;
        margin-bottom: 26px;
        font-size: 1.05rem;
      }

      .subtitle-left {
        text-align: left;
        margin-bottom: 18px;
        font-weight: 600;
      }

      /* INPUT */
      label {
        font-size: 0.95rem;
        color: #1e293b;
        margin-bottom: 6px;
        display: block;
      }

      input {
        width: 100%;
        padding: 16px;
        font-size: 1rem;
        border-radius: 14px;
        border: 1px solid #d1d5db;
        background: rgba(249, 250, 251, 0.9);
        margin-bottom: 18px;
        transition: 0.25s ease;
      }

      input:focus {
        border-color: #1e40af;
        background: white;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25);
        outline: none;
      }

      /* ERROR */
      .errorMsg {
        color: #dc2626;
        min-height: 18px;
        font-size: 0.9rem;
        text-align: center;
        margin-bottom: 12px;
      }

      /* BUTTON */
      button {
        padding: 12px 22px;
        font-size: 1rem;
        font-weight: 600;
        background: linear-gradient(135deg, #3b82f6, #1e3a8a);
        color: white;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        transition: all 0.25s ease;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(59, 130, 246, 0.4);
      }

      /* TOPBAR */
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 22px;
        margin-bottom: 20px;
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(18px);
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      }

      .top-title {
        font-size: 1.4rem;
        font-weight: 800;
        color: #1e293b;
      }

      .top-subtitle {
        font-size: 0.9rem;
        color: #475569;
      }

      .top-right {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      /* LOGOUT */
      #logoutBtn {
        background: linear-gradient(135deg, #ef4444, #f97316);
      }

      #logoutBtn:hover {
        box-shadow: 0 10px 26px rgba(239, 68, 68, 0.45);
      }

      /* CONNECTION BADGE */
      .connection-badge {
        padding: 7px 16px;
        border-radius: 999px;
        font-size: 0.85rem;
        font-weight: 700;
        min-width: 120px;
        text-align: center;
      }

      .connected {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: white;
      }

      .disconnected {
        background: linear-gradient(135deg, #ef4444, #b91c1c);
        color: white;
      }

      /* SENSOR GRID */
      .sensor-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
      }

      /* SENSOR CARD */
      .card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(14px);
        border-radius: 20px;
        padding: 20px 18px;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(59, 130, 246, 0.18),
          transparent 60%
        );
        opacity: 0;
        transition: 0.3s;
      }

      .card:hover {
        transform: translateY(-6px) scale(1.02);
      }

      .card:hover::before {
        opacity: 1;
      }

      .sensor-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #64748b;
      }

      .value {
        text-align: center;
        font-size: 1.5rem;
        font-weight: 800;
        color: #1e293b;
      }

      .status {
        margin-top: 6px;
        font-size: 0.9rem;
        text-align: center;
        color: #475569;
      }

      /* ZOOM TEXT */
      .zoom-text {
        animation: zoomPulse 5s ease infinite;
      }

      @keyframes zoomPulse {
        0% { transform: scale(1); }
        4% { transform: scale(1.18); }
        8% { transform: scale(1); }
        100% { transform: scale(1); }
      }

      /* LEAF */
      .leaf {
        position: fixed;
        top: -10%;
        font-size: 22px;
        opacity: 0.8;
        pointer-events: none;
        animation: fall linear;
        z-index: 0;
      }

      @keyframes fall {
        to {
          transform: translateY(110vh) translateX(var(--moveX)) rotate(360deg);
          opacity: 0;
        }
      }

      /* RESPONSIVE */
      @media (max-width: 768px) {
        .topbar {
          flex-direction: column;
          gap: 10px;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <!-- LOGIN PAGE -->
    <div id="loginPage" class="page">
      <div class="main-card">
        <div class="title">🌱 Smart Plant</div>
        <div class="subtitle">Masuk untuk memantau greenhouse</div>

        <label>Email</label>
        <input type="email" id="email" placeholder="youremail@example.com" />

        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" />

        <div id="errorMsg" class="errorMsg"></div>

        <button id="loginBtn" style="width: 100%; margin-top: 4px">
          Masuk
        </button>
      </div>
    </div>

    <!-- DASHBOARD PAGE -->
    <div id="dashboardPage" class="page" style="display: none">
      <div class="dashboard-container">
        <!-- NAVBAR / TOPBAR -->
        <header class="topbar">
          <div class="top-left">
            <div class="top-title" id="welcomeText">Halo 👋</div>
            <div class="top-subtitle">
              Selamat datang di Smart Plant Dashboard
            </div>
          </div>
          <div class="top-right">
            <div id="connectionStatus" class="connection-badge disconnected">
              Disconnected
            </div>
            <button id="logoutBtn">Keluar</button>
          </div>
        </header>

        <!-- ISI DASHBOARD -->
        <div class="main-card">
          <div class="subtitle subtitle-left">Kondisi greenhouse hari ini:</div>

          <div class="sensor-grid">
            <div class="card sensor-card">
              <div class="sensor-label">Sensor 1</div>
              <h3 class="value">Kelembaban Tanah 💧</h3>
              <div id="soilMoisture" class="value zoom-text">-- %</div>
              <div id="soilStatus" class="status"></div>
            </div>

            <div class="card sensor-card">
              <div class="sensor-label">Sensor 2</div>
              <h3 class="value">Tingkat Cahaya ☀️</h3>
              <div id="lightLevel" class="value zoom-text">-- %</div>
              <div id="lightStatus" class="status"></div>
            </div>

            <div class="card sensor-card">
              <div class="sensor-label">Sensor 3</div>
              <h3 class="value">Gerakan (PIR) 👣</h3>
              <div id="motion" class="value zoom-text">--</div>
              <div id="motionStatus" class="status"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const validEmail = "admin@gmail.com";
      const validPass = "admin123";

      const loginPage = document.getElementById("loginPage");
      const dashboardPage = document.getElementById("dashboardPage");
      const errorMsg = document.getElementById("errorMsg");
      const connectionStatus = document.getElementById("connectionStatus");

      // FUNGSI STATUS KONEKSI
      function setConnectionStatus(isConnected) {
        if (!connectionStatus) return;
        if (isConnected) {
          connectionStatus.textContent = "Connected";
          connectionStatus.classList.add("connected");
          connectionStatus.classList.remove("disconnected");
        } else {
          connectionStatus.textContent = "Disconnected";
          connectionStatus.classList.add("disconnected");
          connectionStatus.classList.remove("connected");
        }
      }

      // Default awal: belum terhubung
      setConnectionStatus(false);

      // LOGIN
      document.getElementById("loginBtn").addEventListener("click", () => {
  const email = document.getElementById("email").value.trim();
  const pass = document.getElementById("password").value.trim();

  if (email === validEmail && pass === validPass) {
    errorMsg.textContent = "";
    loginPage.style.display = "none";
    dashboardPage.style.display = "block";
    setConnectionStatus(true);

    // 🔹 Ambil nama dari email (sebelum @)
    const nameFromEmail = email.split("@")[0];

    // 🔹 Ubah teks Halo
    document.getElementById("welcomeText").innerText =
      "Halo, " + nameFromEmail + " 👋";

  } else {
    errorMsg.textContent = "Email atau password salah";
  }
});


      // LOGOUT
      document.getElementById("logoutBtn").addEventListener("click", () => {
        dashboardPage.style.display = "none";
        loginPage.style.display = "flex";
        setConnectionStatus(false);
      });

      // FUNGSI UPDATE SENSOR (bisa dipanggil dari Firebase / API)
      function updateSoil(value) {
        document.getElementById("soilMoisture").innerText = value + " %";
        document.getElementById("soilStatus").innerText =
          "Status: " + (value < 30 ? "Kering" : value < 70 ? "Cukup" : "Basah");
      }

      function updateLight(value) {
        document.getElementById("lightLevel").innerText = value + " %";
        document.getElementById("lightStatus").innerText =
          "Status: " + (value < 30 ? "Redup" : value < 70 ? "Cukup" : "Terang");
      }

      function updateMotion(value) {
        document.getElementById("motion").innerText = value
          ? "Terdeteksi"
          : "Tidak Terdeteksi";
        document.getElementById("motionStatus").innerText =
          "Status: " + (value ? "Ada Gerakan" : "Aman");
      }

      // ANIMASI DAUN
      function spawnLeaf() {
        const leaf = document.createElement("div");
        leaf.classList.add("leaf");

        const leaves = ["🌾", "☀️", "🌧️", "🌾"];
        leaf.innerText = leaves[Math.floor(Math.random() * leaves.length)];

        leaf.style.left = Math.random() * 100 + "vw";
        leaf.style.fontSize = Math.random() * 14 + 18 + "px";

        const duration = Math.random() * 4 + 4;
        leaf.style.animationDuration = duration + "s";

        leaf.style.setProperty("--moveX", Math.random() * 80 - 40 + "vw");

        document.body.appendChild(leaf);

        setTimeout(() => leaf.remove(), duration * 1000);
      }

      setInterval(spawnLeaf, 700);
    </script>
  </body>
</html>
